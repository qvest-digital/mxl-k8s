# -- Global settings inherited by every component unless overridden.
global:
  image:
    # -- Container registry prefix. Per-component image.repository is
    # appended to this.
    registry: ghcr.io/qvest-digital/mxl-k8s
    # -- Default imagePullPolicy. Per-component override wins.
    # @schema
    # enum: ["Always", "IfNotPresent", "Never"]
    # @schema
    pullPolicy: IfNotPresent
    # -- Image pull secrets, applied to every Pod.
    pullSecrets: []
  # -- Labels added to every object the chart renders.
  commonLabels: {}
  # -- Annotations added to every object the chart renders.
  commonAnnotations: {}

# -- Namespace handling. Most Flux users set createNamespace on the
# HelmRelease and leave namespace.create=false here.
namespace:
  create: false
  # -- Namespace the chart's namespaced resources land in. Falls back
  # to .Release.Namespace when empty.
  name: ""

# -- CRD handling. The chart installs CRDs from its crds/ directory by
# default. Helm only installs them on first install and never deletes
# or upgrades them; Flux's HelmRelease.spec.{install,upgrade}.crds
# governs replace semantics. Set skipInstall=true when CRDs are
# managed by a separate Kustomization or operator framework.
crds:
  skipInstall: false

# -- ClusterRoles and ClusterRoleBindings for every enabled component.
# Set to false when RBAC is centrally managed.
rbac:
  create: true

# -- Pre-delete lifecycle hooks. The domain wipe removes stale
# .mxl-flow directories under gateway.flags.domainPath at chart
# uninstall, because they live on a hostPath and survive namespace
# and CRD teardown.
cleanup:
  preDeleteDomainWipe:
    # -- Wipe stale .mxl-flow directories under gateway.flags.domainPath
    # during helm uninstall, closing the cold-reinstall lifecycle bug
    # where surviving hostPath state from a prior install causes the
    # agent classifier to default the dirs to Origin on the next
    # install (ghost source-side initiator).
    #
    # Set to false if either applies:
    #   - producers (libmxl writers) are still mmap-attached to files
    #     under domainPath at uninstall time. rm -rf does not crash
    #     producers (mmap regions survive unlink), but their writes
    #     are orphaned from any new consumer. Drain producers first,
    #     then uninstall.
    #   - host state under domainPath is intentionally reused across
    #     chart reinstalls (advanced; expect to clean up manually to
    #     avoid the ghost-initiator bug).
    enabled: true
    # @schema
    # minimum: 1
    # @schema
    # -- Effective node count for the agent DaemonSet. An under-set
    # value yields a partial wipe; the nodecount-guard init-container
    # fails the chart with a clear error in that case.
    nodeCount: 1
    # -- Image used by the cleanup Job. Pinned tag (no :latest).
    image: busybox:1.38
    # -- Image used by the nodecount-guard init-container. Must
    # carry a kubectl binary on PATH.
    guardImage: bitnami/kubectl:1.31
    # @schema
    # minimum: 1
    # @schema
    # -- Per-pod completion timeout.
    timeoutSeconds: 120

# -- Operator: cluster-wide reconciler for MxlReceiver, MxlFlowMirror,
# and related CRDs. Single Deployment.
operator:
  enabled: true
  # @schema
  # minimum: 1
  # @schema
  replicaCount: 1
  image:
    repository: operator
    # -- Image tag. Empty defaults to the chart appVersion prefixed
    # with "v": the operator image is released under the chart version.
    # Set this or image.digest.
    tag: ""
    # -- Image digest. Wins over tag when set.
    # @schema
    # pattern: ^$|^sha256:[0-9a-f]{64}$
    # @schema
    digest: ""
    # -- imagePullPolicy override. Empty falls back to global.
    # @schema
    # enum: ["", "Always", "IfNotPresent", "Never"]
    # @schema
    pullPolicy: ""
  # -- Extra raw args appended after the structured flags.
  args: []
  # -- Structured CLI flags. Rendered via the helper as --key=value.
  flags:
    # @schema
    # pattern: ^:[0-9]+$|^[0-9.]+:[0-9]+$
    # @schema
    metricsBindAddress: ":8080"
    # @schema
    # pattern: ^:[0-9]+$|^[0-9.]+:[0-9]+$
    # @schema
    healthProbeBindAddress: ":8081"
    # -- Enable leader election. Required for replicaCount > 1.
    leaderElect: false
    # @schema
    # enum: ["debug", "info", "warn", "error"]
    # @schema
    zapLogLevel: info
    zapDevel: false
  serviceAccount:
    create: true
    # -- ServiceAccount name. Empty falls back to a generated name.
    name: ""
    annotations: {}
    labels: {}
    automountServiceAccountToken: true
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits: {}
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  livenessProbe:
    httpGet:
      path: /healthz
      port: probe
    initialDelaySeconds: 5
  readinessProbe:
    httpGet:
      path: /readyz
      port: probe
    initialDelaySeconds: 2
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []
  initContainers: []
  podDisruptionBudget:
    enabled: false
    # @schema
    # minimum: 1
    # @schema
    minAvailable: 1
  metrics:
    service:
      enabled: true
      # @schema
      # enum: ["ClusterIP", "NodePort", "LoadBalancer"]
      # @schema
      type: ClusterIP
      # @schema
      # minimum: 1
      # maximum: 65535
      # @schema
      port: 8080
    serviceMonitor:
      # -- Render a Prometheus Operator ServiceMonitor. Requires the
      # monitoring.coreos.com CRDs to be installed cluster-wide.
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      relabelings: []
      metricRelabelings: []

# -- Agent: per-node DaemonSet that watches the MXL domain via
# fanotify, publishes flow state, and serves the LD_PRELOAD intent
# socket.
agent:
  enabled: true
  updateStrategy:
    # @schema
    # enum: ["RollingUpdate", "OnDelete"]
    # @schema
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  image:
    repository: agent
    # -- Image tag. Empty defaults to the chart appVersion prefixed
    # with "v": the agent image is released under the chart version.
    # Set this or image.digest.
    tag: ""
    # @schema
    # pattern: ^$|^sha256:[0-9a-f]{64}$
    # @schema
    digest: ""
    # @schema
    # enum: ["", "Always", "IfNotPresent", "Never"]
    # @schema
    pullPolicy: ""
  args: []
  flags:
    # @schema
    # pattern: ^/.+
    # @schema
    domainPath: /run/mxl/domain
    # @schema
    # pattern: ^/.+
    # @schema
    intentSocket: /run/mxl/agent.sock
    # @schema
    # pattern: ^$|^/.+
    # @schema
    # -- Where the agent drops the copy of libmxl-intent.so its image
    # carries, on every start. A consumer that already mounts
    # hostPath.run for the intent socket preloads the shim from there
    # instead of copying it out of the carrier image with an
    # initContainer. Keep the path under hostPath.run, or consumer
    # pods cannot see it. Empty disables the drop.
    shimPath: /run/mxl/libmxl-intent.so
    materializeTimeout: 5s
    resyncPeriod: 30s
    # -- Client-side request rate to the API server. A node holding
    # many flows spends one Get and one Update per flow per renewal
    # pass; at the client-go default of 5 the loop blocks rather than
    # fails, stretching past the Lease duration it exists to keep
    # fresh. 0 leaves the client-go default in place.
    kubeApiQps: 50
    # -- Client-side burst above kubeApiQps. 0 leaves the client-go
    # default in place.
    kubeApiBurst: 100
    # @schema
    # enum: ["", "tcp", "verbs", "efa", "shm", "auto"]
    # @schema
    # -- Explicit libmxl-fabrics provider stamped onto on-demand
    # (intent-driven) mirrors, bypassing per-node resolution. Empty (or
    # "auto") resolves a concrete provider from the source and target
    # nodes' MxlNodeCapabilities; set a concrete value to force one
    # cluster-wide.
    provider: ""
    # @schema
    # pattern: ^:[0-9]+$|^[0-9.]+:[0-9]+$
    # @schema
    metricsBindAddress: ":8080"
    # @schema
    # pattern: ^:[0-9]+$|^[0-9.]+:[0-9]+$
    # @schema
    healthProbeBindAddress: ":8081"
    # @schema
    # enum: ["debug", "info", "warn", "error"]
    # @schema
    zapLogLevel: info
  # -- hostPath layout. The agent mounts the whole /run/mxl so the
  # intent socket lands on the host where consumer pods can see it.
  hostPath:
    # @schema
    # pattern: ^/.+
    # @schema
    run: /run/mxl
    # @schema
    # enum: ["DirectoryOrCreate", "Directory"]
    # @schema
    type: DirectoryOrCreate
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    labels: {}
    automountServiceAccountToken: true
  # -- Run the agent in the host PID namespace. Required for the
  # intent socket's SO_PEERCRED-based pod identification: without it
  # the connecting consumer pod's PID is not visible to the agent
  # and the on-demand mirror materialization path silently fails.
  hostPID: true
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits: {}
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    # -- fanotify on /run/mxl/domain reads host inodes, so the agent
    # currently runs as root. PSA-restricted environments cannot host
    # the agent without a policy exception.
    runAsNonRoot: false
    readOnlyRootFilesystem: true
    capabilities:
      add: ["SYS_ADMIN"]
      drop: ["ALL"]
  livenessProbe:
    httpGet:
      path: /healthz
      port: probe
    initialDelaySeconds: 5
  readinessProbe:
    httpGet:
      path: /readyz
      port: probe
    initialDelaySeconds: 2
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []
  initContainers: []
  metrics:
    service:
      enabled: true
      # @schema
      # enum: ["ClusterIP", "NodePort", "LoadBalancer"]
      # @schema
      type: ClusterIP
      # @schema
      # minimum: 1
      # maximum: 65535
      # @schema
      port: 8080
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      relabelings: []
      metricRelabelings: []

# -- Gateway: per-node DaemonSet that owns libmxl-fabrics handles and
# moves grains across the wire. Runs with hostNetwork so the fabric
# endpoint binds the node interface.
gateway:
  enabled: true
  updateStrategy:
    # @schema
    # enum: ["RollingUpdate", "OnDelete"]
    # @schema
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  image:
    repository: gateway
    # -- Image tag. Empty defaults to the chart appVersion prefixed
    # with "v": the gateway image is released under the chart version.
    # Set this or image.digest.
    tag: ""
    # @schema
    # pattern: ^$|^sha256:[0-9a-f]{64}$
    # @schema
    digest: ""
    # @schema
    # enum: ["", "Always", "IfNotPresent", "Never"]
    # @schema
    pullPolicy: ""
  args: []
  flags:
    # @schema
    # pattern: ^/.+
    # @schema
    domainPath: /run/mxl/domain
    # -- Bind address for libmxl-fabrics endpoints. Default uses the
    # downward-API POD_IP so each gateway binds its node IP. An
    # explicit empty string ("") emits `--bind-address=` (bare equals),
    # which suppresses the POD_IP fallback so libfabric picks the
    # interface; useful when the gateway runs on a Multus-attached
    # NAD and the RDMA fabric is a secondary netdev.
    bindAddress: $(POD_IP)
    # @schema
    # items:
    #   enum: ["tcp", "verbs", "efa", "shm", "any", "auto"]
    # @schema
    # -- Upper bound on the libmxl-fabrics providers a gateway may
    # advertise and use. Each node publishes this list intersected
    # with what libmxl-fabrics finds on it, so `any` advertises the
    # hardware that is present and nothing else. Narrow it to keep a
    # provider out of consideration on every node.
    providers:
      - any
    # -- CIDRs the fabric interfaces must fall inside. Empty
    # considers every address libmxl-fabrics reports, which on a node
    # with several NICs includes the ones carrying ST 2110 essence,
    # cluster traffic, or out-of-band management. Set this to the
    # subnet of the MXL fabric to keep mirrors off them. Applies to
    # both what a node advertises and what a mirror binds.
    fabricCidr: []
    # -- Device names the fabric interfaces must match, as the
    # provider names them (the kernel netdev name for tcp, the NIC
    # name libfabric reports otherwise). Empty considers every
    # device. Useful where the fabric shares a subnet with other
    # traffic.
    fabricDevice: []
    # -- Minimum link speed a fabric interface must report, as a
    # quantity in bits per second (for example 25G). Empty imposes no
    # floor. An interface whose provider reports no link speed is
    # rejected when this is set, which includes interfaces with no
    # physical NIC behind them.
    fabricMinLinkSpeed: ""
    resyncPeriod: 30s
    # -- Shortest interval between two libmxl-fabrics interface
    # enumerations. Status still refreshes every resyncPeriod from the
    # last result. Each enumeration sweeps every provider libfabric was
    # built with and warns about those it finds no device for.
    probePeriod: 5m
    # -- Grain-commit inactivity after which the target gateway
    # demotes a mirror to Degraded. Same threshold gates the
    # Reconcile fast-path so a stale Ready status falls through to
    # re-establish.
    degradedAfter: 10s
    # -- How long a source-side reader may report an unchanged head
    # index, having never transferred a grain, before SourceProgress
    # reports ReaderNotAdvancing.
    readerStallAfter: 20s
    # -- How much of a grain's own interval the source gateway spreads
    # that grain's transmission over, instead of handing the fabric a
    # whole grain the NIC then drains at line rate. Negative disables
    # pacing and restores whole-grain transfers, which is the default:
    # the burst is only worth shaping where a receiver loses grains to
    # it, and where nothing is lost the added latency and the per-chunk
    # cost buy nothing. Turn it on when a receiver several flows
    # converge on reports drops well below nominal link utilisation,
    # which is the signature of overlapping bursts rather than of
    # offered load. Peak rate becomes the flow's own rate divided by
    # this, so 0.5 halves the burst and doubles its length, and is
    # where to start. The cost is latency: a grain completes at the
    # receiver up to this much of its interval later. Depends on the
    # flow's edit rate alone, never on the link speed, so one value
    # holds from 25GbE to EFA. Raise it toward 1 while drops remain;
    # lower it when the added latency matters more than the burst.
    # Must stay below 1, or a grain's transmission runs into the next
    # one.
    pacingFraction: -1
    # -- How many slice ranges a paced grain is split into. Read only
    # while pacingFraction is positive. This sets how short the
    # individual bursts get: the contiguous burst is one grain divided
    # by this, and switch buffer occupancy follows that length. Each
    # range costs one cgo call and, because a partial range leaves
    # libmxl-fabrics's one-write-per-grain fast path, one RMA write per
    # plane. Raise it if the switch still reports drops at a pacing
    # fraction you are happy with; lower it if gateway CPU is the
    # constraint. Capped by the grain's slice count, so a flow with
    # fewer slices than this uses one range per slice. Under 2 disables
    # pacing.
    pacingChunks: 8
    # -- How often libmxl reclaims flow directories no writer holds.
    # The criterion is libmxl's own: a writer keeps a shared lock for
    # as long as it is attached, so a live producer or mirror writer is
    # never a candidate however long since its last grain. Set to 0 to
    # disable reclaiming.
    domainGcInterval: 5m
    # -- How long after start the first reclaim sweep is held back. A
    # restarted gateway has no writer attached to the mirror copies it
    # was serving, and a consumer's reader does not protect them, so a
    # sweep inside this window would delete flows consumers are still
    # reading and the reconciler is about to re-establish. Must outlast
    # the reconciler's re-establish path.
    domainGcGrace: 2m
    # -- How old a half-built flow directory must be before it is
    # reclaimed. libmxl builds a flow under a temporary name and renames
    # it into place, removing it on every unwinding exit, so only a death
    # that skips unwinding leaves one -- and libmxl's own collection
    # walks published flows, so nothing sees it afterwards. A producer
    # SIGKILLed part way through allocating its ring therefore leaves the
    # whole allocation in the shared domain, at the node's expense rather
    # than its own. Whether a writer still holds the scaffold is decided
    # by the same lock libmxl uses; this only spans the moment between
    # the data file being created and locked. Negative disables it.
    domainGcScaffoldGrace: 10m
    # -- Client-side request rate to the API server. A node holding
    # many flows spends one Get and one Update per flow per renewal
    # pass; at the client-go default of 5 the loop blocks rather than
    # fails, stretching past the Lease duration it exists to keep
    # fresh. 0 leaves the client-go default in place.
    kubeApiQps: 50
    # -- Client-side burst above kubeApiQps. 0 leaves the client-go
    # default in place.
    kubeApiBurst: 100
    # @schema
    # pattern: ^:[0-9]+$|^[0-9.]+:[0-9]+$
    # @schema
    metricsBindAddress: ":8080"
    # @schema
    # pattern: ^:[0-9]+$|^[0-9.]+:[0-9]+$
    # @schema
    healthProbeBindAddress: ":8081"
    # @schema
    # pattern: ^$|^(127\.0\.0\.1|localhost):[0-9]+$
    # @schema
    # -- Bind address for the net/http/pprof endpoint. Empty
    # disables; otherwise must be a loopback bind (127.0.0.1: or
    # localhost:). Use kubectl port-forward to reach the endpoint;
    # see docs/diagnostics/perf-shortfall.md for the capture
    # recipe.
    pprofBindAddress: ""
    # @schema
    # enum: ["debug", "info", "warn", "error"]
    # @schema
    zapLogLevel: info
  # -- hostNetwork is required because the libmxl-fabrics TargetInfo
  # embeds the host:port a peer dials; a CNI overlay IP would not be
  # reachable cross-node.
  hostNetwork: true
  # @schema
  # enum: ["ClusterFirst", "ClusterFirstWithHostNet", "Default", "None"]
  # @schema
  dnsPolicy: ClusterFirstWithHostNet
  hostPath:
    # @schema
    # pattern: ^/.+
    # @schema
    domain: /run/mxl/domain
    # @schema
    # enum: ["DirectoryOrCreate", "Directory"]
    # @schema
    type: DirectoryOrCreate
  rdma:
    # -- Add the capabilities the verbs/efa providers need
    # (IPC_LOCK, SYS_RESOURCE; libmxl pins shm pages).
    enabled: false
    # -- Bind-mount the host's InfiniBand device directory into
    # the gateway. Only consulted when rdma.enabled is set.
    # A bind mount alone does not pass the cgroup-v2 device
    # controller, so a node whose devices come from a device
    # plugin wants this off and `resourceName` set instead.
    mountInfiniband: true
    # @schema
    # pattern: ^/.+
    # @schema
    infinibandHostPath: /dev/infiniband
    # @schema
    # enum: ["Directory", "DirectoryOrCreate"]
    # @schema
    # -- hostPath type for the InfiniBand mount. `Directory`
    # holds the pod in ContainerCreating on a node where the
    # path is absent, which is a deliberate failure on a
    # DaemonSet that is only meant to run on RDMA-capable
    # nodes, and a hang on one that is not.
    infinibandHostPathType: Directory
    extraEnv: []
    # -- Extended-resource name advertised by a Kubernetes
    # device plugin. `devic.es/rdma` from generic-device-plugin
    # and `rdma/hca_shared_devices` from
    # k8s-rdma-shared-dev-plugin cover on-prem verbs;
    # `vpc.amazonaws.com/efa` from aws-efa-k8s-device-plugin
    # covers EFA; a site may advertise something else entirely.
    # When non-empty, the gateway container gets
    # `<resourceName>: 1` on both requests and limits. Empty
    # disables the request.
    #
    # The request is what grants the container its cgroup
    # device permissions, and it also makes the pod
    # unschedulable on any node not advertising the resource --
    # which is why a cluster with mixed hardware needs
    # `gateway.variants` rather than one DaemonSet.
    resourceName: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    labels: {}
    automountServiceAccountToken: true
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits: {}
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: false
    readOnlyRootFilesystem: true
    capabilities:
      # -- Additional caps beyond what rdma.enabled implies.
      add: []
      drop: ["ALL"]
  livenessProbe:
    httpGet:
      path: /healthz
      port: probe
    initialDelaySeconds: 5
  readinessProbe:
    httpGet:
      path: /readyz
      port: probe
    initialDelaySeconds: 2
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []
  initContainers: []
  metrics:
    service:
      enabled: true
      # @schema
      # enum: ["ClusterIP", "NodePort", "LoadBalancer"]
      # @schema
      type: ClusterIP
      # @schema
      # minimum: 1
      # maximum: 65535
      # @schema
      port: 8080
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      relabelings: []
      metricRelabelings: []
  # @schema
  # additionalProperties:
  #   type: object
  # @schema
  # -- Render the gateway DaemonSet once per enabled entry instead of
  # once, for a cluster whose nodes do not all carry the same fabric
  # hardware. With nothing enabled -- the default -- exactly one
  # DaemonSet renders from the values above, which is what a uniform
  # cluster wants.
  #
  # Keys name the variant and suffix the DaemonSet name, so they have
  # to be DNS-1123 labels. Entries beyond the three below are allowed;
  # each may override any key under `gateway`, with maps merging key
  # by key against the values above and lists replacing wholesale.
  #
  # Placement is deliberately unset on every entry. Which label marks
  # a node's fabric is a site's choice, and a default here would not
  # be replaced by a downstream override but merged with it, leaving a
  # nodeSelector that demands both labels and matches no node.
  #
  # Enabling two or more entries means declaring their placement, and
  # the placements have to be complementary: two gateways on one node
  # open the same MXL domain, reconcile the same mirrors, and write
  # the same MxlNodeCapabilities, which is named after the node. Helm
  # cannot read node labels, so it rejects only the combinations that
  # guarantee overlap. Keying every variant on a distinct value of one
  # label is what makes overlap impossible; a class defined by the
  # absence of that label needs `affinity` with `DoesNotExist`, which
  # a nodeSelector cannot express. See docs/RDMA.md.
  variants:
    # RoCEv2 / InfiniBand. resourceName is left empty because which
    # plugin advertises the device is a site's choice
    # (`devic.es/rdma` from generic-device-plugin,
    # `rdma/hca_shared_devices` from k8s-rdma-shared-dev-plugin).
    verbs:
      enabled: false
      flags:
        providers: [tcp, verbs]
      rdma:
        enabled: true
        mountInfiniband: false
        resourceName: ""
    # AWS Elastic Fabric Adapter. Its device plugin advertises one
    # resource name cluster-wide, so that one is filled in. EFA node
    # groups are conventionally tainted with the same key, which a
    # variant selecting them has to tolerate.
    efa:
      enabled: false
      flags:
        providers: [tcp, efa]
      rdma:
        enabled: true
        mountInfiniband: false
        resourceName: vpc.amazonaws.com/efa
    # Nodes with no fabric device. Needs no resource request, so it
    # schedules anywhere its placement allows.
    tcp:
      enabled: false
      flags:
        providers: [tcp]

# Per-node flow metrics exporter. Reads the node's MXL domain and
# serves Prometheus metrics for every flow materialized on it. A domain
# is shared by every pod on its node, so one DaemonSet covers the node
# and reports each flow once; a second reader of the same domain would
# only repeat it.
exporter:
  # -- Deploy the exporter DaemonSet.
  enabled: false
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  image:
    repository: exporter
    # -- Image tag. Empty defaults to the chart appVersion prefixed
    # with "v": the exporter image is released under the chart version.
    # Set this or image.digest.
    tag: ""
    # -- Image digest. Wins over tag when set.
    # @schema
    # pattern: ^$|^sha256:[0-9a-f]{64}$
    # @schema
    digest: ""
    # @schema
    # enum: ["", "Always", "IfNotPresent", "Never"]
    # @schema
    pullPolicy: ""
  # -- Extra raw args appended after the rendered flags.
  args: []
  # -- Structured CLI flags. Rendered by a helper as --key=value.
  flags:
    # @schema
    # pattern: ^:[0-9]+$|^[0-9.]+:[0-9]+$
    # @schema
    metricsBindAddress: ":8080"
    # @schema
    # pattern: ^:[0-9]+$|^[0-9.]+:[0-9]+$
    # @schema
    healthProbeBindAddress: ":8081"
    # -- Absolute path of the MXL domain directory to report on. Must
    # resolve to the same domain the agent watches, below hostPath.run.
    domainPath: /run/mxl/domain
    # -- How often the domain directory is re-listed for flows that
    # appeared or disappeared. Scrapes read the cache this maintains.
    scanPeriod: 5s
    # -- How long a departed flow keeps being exported with
    # mxl_flow_present at 0, so a flow that ends between two scrapes
    # leaves a record rather than a gap. One sweep of
    # gateway.flags.domainGcInterval, so the metric set describes the
    # domain as it is rather than as it was.
    flowLifetime: 5m
    # @schema
    # enum: ["debug", "info", "warn", "error"]
    # @schema
    zapLogLevel: info
  # -- hostPath layout. The exporter mounts the runtime root read-only;
  # it opens libmxl flow readers and never writes into the domain.
  hostPath:
    run: /run/mxl
    # @schema
    # enum: ["", "DirectoryOrCreate", "Directory"]
    # @schema
    type: Directory
  topology:
    # -- Publish mxl_flow_location_info from the MxlFlow CRs. That is
    # what names the producing node (phase Origin), so dashboards do
    # not need media functions to label themselves. Disabling it drops
    # the metric and the exporter's only API access.
    enabled: true
  serviceAccount:
    create: true
    # -- ServiceAccount name. Empty falls back to the generated name.
    name: ""
    annotations: {}
    labels: {}
    automountServiceAccountToken: true
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits: {}
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  livenessProbe:
    httpGet:
      path: /healthz
      port: probe
    initialDelaySeconds: 5
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: probe
    initialDelaySeconds: 2
    periodSeconds: 10
  metrics:
    service:
      enabled: true
      # @schema
      # enum: ["ClusterIP", "NodePort", "LoadBalancer"]
      # @schema
      type: ClusterIP
      # @schema
      # minimum: 1
      # maximum: 65535
      # @schema
      port: 8080
    serviceMonitor:
      # -- Create a ServiceMonitor. Requires the monitoring.coreos.com
      # CRDs to be installed cluster-wide.
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      relabelings: []
      metricRelabelings: []

# Grafana dashboards for the exporter's metrics, shipped as ConfigMaps
# for Grafana's dashboard sidecar to discover.
dashboards:
  # -- Ship the bundled dashboards.
  enabled: false
  # -- Namespace to place the ConfigMaps in. Empty uses the release
  # namespace. The sidecar's searchNamespace defaults to the namespace
  # Grafana runs in, so a Grafana installed elsewhere needs either that
  # setting widened or this pointed at it.
  namespace: ""
  # -- Labels the sidecar selects on. A deployment configured with a
  # non-empty sidecar labelValue, or selecting on a release label, sets
  # its own here.
  labels:
    grafana_dashboard: "1"
  # -- Annotations on the ConfigMaps. grafana_folder places the
  # dashboard when the sidecar runs with folderAnnotation set.
  annotations:
    grafana_folder: MXL
  # -- uid of the Prometheus datasource the panels query. The default
  # is what kube-prometheus-stack names its own; a Grafana provisioned
  # otherwise states its uid here.
  datasourceUid: prometheus
