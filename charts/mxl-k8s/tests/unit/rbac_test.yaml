suite: rbac
templates:
  - templates/rbac-operator.yaml
  - templates/rbac-agent.yaml
  - templates/rbac-gateway.yaml
tests:
  - it: rbac.create=false suppresses every ClusterRole and Binding
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: disabling a component drops its ClusterRole regardless of rbac.create
    set:
      operator.enabled: false
      agent.enabled: false
    template: templates/rbac-operator.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: gateway rbac is present by default
    template: templates/rbac-gateway.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1

  - it: agent role can list pods so the intent dispatcher can resolve SO_PEERCRED PIDs
    template: templates/rbac-agent.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [get, list, watch]

  - it: agent role can delete mirrors so it can drop one whose origin moved onto its node
    template: templates/rbac-agent.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [mxl.qvest-digital.com]
            resources: [mxlflowmirrors]
            verbs: [get, list, watch, create, update, patch, delete]

  - it: gateway role can get nodes so it can tell a reclaimed node from a live one
    template: templates/rbac-gateway.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get]

  - it: operator role can watch nodes so it can prune locations of departed ones
    template: templates/rbac-operator.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, watch]
