suite: exporter
templates:
  - templates/daemonset-exporter.yaml
  - templates/rbac-exporter.yaml
tests:
  # Off by default: the exporter is observability, and a chart bump
  # must not start a DaemonSet on every node of a cluster that did not
  # ask for one.
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts the runtime root read-only
    set:
      exporter.enabled: true
    template: templates/daemonset-exporter.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
      - equal:
          path: spec.template.spec.volumes[0].hostPath.path
          value: /run/mxl

  # NODE_NAME labels every series. Two nodes publishing the same flow
  # are indistinguishable without it.
  - it: passes the node name through the downward API
    set:
      exporter.enabled: true
    template: templates/daemonset-exporter.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: NODE_NAME
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.fieldRef.fieldPath
          value: spec.nodeName

  - it: grants read-only access to MxlFlow when topology is on
    set:
      exporter.enabled: true
    template: templates/rbac-exporter.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: rules[0].resources
          value: [mxlflows]
      - equal:
          path: rules[0].verbs
          value: [get, list, watch]

  # Turning topology off has to drop the API access with it, not just
  # the flag: a role granted but unused is a role nobody notices.
  - it: grants no MxlFlow access when topology is off
    set:
      exporter.enabled: true
      exporter.topology.enabled: false
    template: templates/rbac-exporter.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Role
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1

  - it: grants no API access when topology and mirror heartbeats are off
    set:
      exporter.enabled: true
      exporter.topology.enabled: false
      exporter.mirrorHeartbeats.enabled: false
    template: templates/rbac-exporter.yaml
    asserts:
      - hasDocuments:
          count: 0

  # The heartbeat Leases live in the release namespace beside the Origin
  # Leases; reading them needs no cluster-wide grant and no write.
  - it: grants read-only access to the Leases in the release namespace for mirror heartbeats
    set:
      exporter.enabled: true
    release:
      namespace: mxl-system
    template: templates/rbac-exporter.yaml
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Role
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: mxl-system
        documentIndex: 2
      - equal:
          path: rules
          value:
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [get, list, watch]
        documentIndex: 2
      - equal:
          path: roleRef.name
          value: mxl-k8s-exporter-leases
        documentIndex: 3

  # The Role is rendered in the chart's namespace; a watch in any other
  # would be forbidden.
  - it: watches the heartbeat Leases in the namespace the Role is in
    set:
      exporter.enabled: true
      namespace.name: media
    templates:
      - templates/daemonset-exporter.yaml
      - templates/rbac-exporter.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --lease-namespace=media
        template: templates/daemonset-exporter.yaml
      - equal:
          path: metadata.namespace
          value: media
        template: templates/rbac-exporter.yaml
        documentIndex: 2

  - it: renders the mirror heartbeats flag from the same value as the role
    set:
      exporter.enabled: true
      exporter.mirrorHeartbeats.enabled: false
    template: templates/daemonset-exporter.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --mirror-heartbeats=false

  - it: renders the topology flag from the same value as the role
    set:
      exporter.enabled: true
      exporter.topology.enabled: false
    template: templates/daemonset-exporter.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --topology=false

  # Same reason as the agent: an exporter pod is bound to its node.
  - it: runs at system-node-critical by default
    set:
      exporter.enabled: true
    template: templates/daemonset-exporter.yaml
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-node-critical

  - it: renders no priorityClassName when it is empty
    set:
      exporter.enabled: true
      exporter.priorityClassName: ""
    template: templates/daemonset-exporter.yaml
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName
