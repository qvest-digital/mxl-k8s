{{- if and .Values.gateway.enabled .Values.gateway.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Chart.Name }}-gateway
  namespace: {{ include "mxlk8s.namespace" . }}
  labels:
    {{- include "mxlk8s.componentLabels" (dict "Context" . "component" "gateway") | nindent 4 }}
    {{- with .Values.gateway.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mxlk8s.selectorLabels" (dict "Context" . "component" "gateway") | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.gateway.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.gateway.metrics.serviceMonitor.scrapeTimeout }}
      relabelings:
        # Every series carries the gateway variant its pod belongs to, so
        # what a node class publishes groups by variant. A pod of the
        # base gateway has no such label and its series none.
        - sourceLabels: [__meta_kubernetes_pod_label_mxl_qvest_digital_com_gateway_variant]
          targetLabel: variant
        {{- with .Values.gateway.metrics.serviceMonitor.relabelings }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.gateway.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
