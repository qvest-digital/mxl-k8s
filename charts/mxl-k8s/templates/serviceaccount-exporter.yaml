{{- if and .Values.exporter.enabled .Values.exporter.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "exporter" "values" .Values.exporter) }}
  namespace: {{ include "mxlk8s.namespace" . }}
  labels:
    {{- include "mxlk8s.componentLabels" (dict "Context" . "component" "exporter") | nindent 4 }}
    {{- with .Values.exporter.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.global.commonAnnotations .Values.exporter.serviceAccount.annotations }}
  annotations:
    {{- with .Values.global.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.exporter.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.exporter.serviceAccount.automountServiceAccountToken }}
{{- end }}
