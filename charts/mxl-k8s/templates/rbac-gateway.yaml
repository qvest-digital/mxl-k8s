{{- if and .Values.gateway.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "gateway" "values" .Values.gateway) }}
  labels:
    {{- include "mxlk8s.componentLabels" (dict "Context" . "component" "gateway") | nindent 4 }}
rules:
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflowmirrors, mxlnodecapabilities]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflowmirrors/status, mxlnodecapabilities/status]
    verbs: [get, update, patch]
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflowmirrors/finalizers]
    verbs: [update]
  # The target gateway publishes each mirror's target descriptor in an
  # MxlFlowMirrorTarget of the mirror's name; the source gateway reads it.
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflowmirrortargets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflows, mxldomains]
    verbs: [get, list, watch]
  # The gateway on a flow's origin node publishes its batch size hints.
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflows/status]
    verbs: [patch]
  {{- if .Values.mxlfs.enabled }}
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflowredundancysets]
    verbs: [get, list, watch]
  # A merging gateway reports the members it finds stalled.
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflowredundancysets/status]
    verbs: [patch]
  {{- end }}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  # Reaping a finalizer left behind by a gateway whose node was
  # removed requires confirming the node is actually gone.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "gateway" "values" .Values.gateway) }}
  labels:
    {{- include "mxlk8s.componentLabels" (dict "Context" . "component" "gateway") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "gateway" "values" .Values.gateway) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "gateway" "values" .Values.gateway) }}
    namespace: {{ include "mxlk8s.namespace" . }}
---
# Each side of a mirror renews a heartbeat Lease in this namespace and
# deletes it when it releases the mirror. Scoped to the namespace so the
# gateway cannot write any other component's Leases.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "gateway" "values" .Values.gateway) }}-leases
  namespace: {{ include "mxlk8s.namespace" . }}
  labels:
    {{- include "mxlk8s.componentLabels" (dict "Context" . "component" "gateway") | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "gateway" "values" .Values.gateway) }}-leases
  namespace: {{ include "mxlk8s.namespace" . }}
  labels:
    {{- include "mxlk8s.componentLabels" (dict "Context" . "component" "gateway") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "gateway" "values" .Values.gateway) }}-leases
subjects:
  - kind: ServiceAccount
    name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "gateway" "values" .Values.gateway) }}
    namespace: {{ include "mxlk8s.namespace" . }}
{{- end }}
