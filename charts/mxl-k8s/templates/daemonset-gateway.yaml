{{- /*
The gateway renders once per entry in .Values.gateway.variants, or
once from .Values.gateway itself when that list is empty.

A DaemonSet carries one pod template, and a pod that requests an
extended resource is unschedulable on every node that does not
advertise it. Access to an RDMA device goes through exactly such a
request -- vpc.amazonaws.com/efa, rdma/hca_shared_devices, or whatever
the site's device plugin advertises -- because the plugin's Allocate
response is what grants the container its cgroup device permissions.
Kubernetes has no conditional resource request, so a cluster whose
nodes do not all carry the same fabric hardware needs one DaemonSet
per node class, with selectors that do not overlap.

Each variant merges over .Values.gateway: maps merge key by key, lists
replace wholesale. Everything the node class does not change -- image,
probes, update strategy, service account -- stays shared.
*/ -}}
{{- define "mxlk8s.gateway.daemonset" -}}
{{- $ctx := .Context -}}
{{- $g := .gateway -}}
{{- $variant := .variant -}}
{{- /*
Build the effective capability list for the gateway container.
rdma.enabled implies IPC_LOCK + SYS_RESOURCE (libmxl pins shm pages).
Users may add more via containerSecurityContext.capabilities.add.
*/ -}}
{{- $caps := list -}}
{{- if $g.rdma.enabled -}}
  {{- $caps = append $caps "IPC_LOCK" -}}
  {{- $caps = append $caps "SYS_RESOURCE" -}}
{{- end -}}
{{- range $g.containerSecurityContext.capabilities.add -}}
  {{- $caps = append $caps . -}}
{{- end -}}
{{- $caps = uniq $caps -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "mxlk8s.gateway.name" (dict "Context" $ctx "variant" $variant) }}
  namespace: {{ include "mxlk8s.namespace" $ctx }}
  labels:
    {{- include "mxlk8s.componentLabels" (dict "Context" $ctx "component" "gateway") | nindent 4 }}
    {{- with $variant }}{{ include "mxlk8s.gateway.variantLabel" . | nindent 4 }}{{- end }}
  {{- with $ctx.Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mxlk8s.selectorLabels" (dict "Context" $ctx "component" "gateway") | nindent 6 }}
      {{- with $variant }}{{ include "mxlk8s.gateway.variantLabel" . | nindent 6 }}{{- end }}
  updateStrategy:
    {{- toYaml $g.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "mxlk8s.componentLabels" (dict "Context" $ctx "component" "gateway") | nindent 8 }}
        {{- with $variant }}{{ include "mxlk8s.gateway.variantLabel" . | nindent 8 }}{{- end }}
        {{- with $g.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $g.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mxlk8s.serviceAccountName" (dict "Context" $ctx "component" "gateway" "values" $ctx.Values.gateway) }}
      hostNetwork: {{ $g.hostNetwork }}
      dnsPolicy: {{ $g.dnsPolicy }}
      {{- with $ctx.Values.global.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $g.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "mxlk8s.image" (dict "Context" $ctx "image" $g.image) }}
          imagePullPolicy: {{ include "mxlk8s.imagePullPolicy" (dict "global" $ctx.Values.global "image" $g.image) }}
          args:
            {{- include "mxlk8s.flags.render" (dict "flags" $g.flags) | nindent 12 }}
            {{- with $g.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- with $g.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $g.rdma.enabled }}
            {{- with $g.rdma.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          ports:
            - name: probe
              containerPort: 8081
            - name: metrics
              containerPort: 8080
          {{- with $g.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $g.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: {{ $g.containerSecurityContext.allowPrivilegeEscalation }}
            runAsNonRoot: {{ $g.containerSecurityContext.runAsNonRoot }}
            readOnlyRootFilesystem: {{ $g.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- toYaml $g.containerSecurityContext.capabilities.drop | nindent 16 }}
              {{- if gt (len $caps) 0 }}
              add:
                {{- range $caps }}
                - {{ . }}
                {{- end }}
              {{- end }}
          resources:
            {{- $resources := deepCopy $g.resources -}}
            {{- with $g.rdma.resourceName -}}
              {{- $requests := default (dict) $resources.requests -}}
              {{- $limits   := default (dict) $resources.limits -}}
              {{- $_ := set $resources "requests" (merge $requests (dict . 1)) -}}
              {{- $_ := set $resources "limits"   (merge $limits   (dict . 1)) -}}
            {{- end }}
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: mxl-domain
              mountPath: {{ $g.hostPath.domain }}
            {{- if and $g.rdma.enabled $g.rdma.mountInfiniband }}
            - name: infiniband
              mountPath: {{ $g.rdma.infinibandHostPath }}
            {{- end }}
            {{- with $g.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with $g.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: mxl-domain
          hostPath:
            path: {{ $g.hostPath.domain }}
            type: {{ $g.hostPath.type }}
        {{- if and $g.rdma.enabled $g.rdma.mountInfiniband }}
        - name: infiniband
          hostPath:
            path: {{ $g.rdma.infinibandHostPath }}
            type: {{ $g.rdma.infinibandHostPathType }}
        {{- end }}
        {{- with $g.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end -}}

{{- if .Values.gateway.enabled }}
{{- $variants := .Values.gateway.variants | default dict }}
{{- include "mxlk8s.gateway.validateVariants" $variants }}
{{- /*
The base every variant merges over. variants is dropped from it so a
variant does not carry a copy of its siblings.
*/ -}}
{{- $base := omit .Values.gateway "variants" }}
{{- $enabled := dict }}
{{- range $name, $variant := $variants }}
  {{- if $variant.enabled }}
    {{- $_ := set $enabled $name $variant }}
  {{- end }}
{{- end }}
{{- if eq (len $enabled) 0 }}
{{- include "mxlk8s.gateway.daemonset" (dict "Context" . "gateway" $base "variant" "") }}
{{- else }}
{{- range $name, $variant := $enabled }}
---
{{ include "mxlk8s.gateway.daemonset" (dict "Context" $ "gateway" (mergeOverwrite (deepCopy $base) (omit $variant "enabled")) "variant" $name) }}
{{- end }}
{{- end }}
{{- end }}
