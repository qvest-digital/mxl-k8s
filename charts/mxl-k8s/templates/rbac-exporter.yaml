{{- if and .Values.exporter.enabled .Values.exporter.topology.enabled .Values.rbac.create }}
# Read-only, and only MxlFlow: the exporter derives which node produces
# a flow from status.locations and writes nothing back. Disabling
# exporter.topology drops both this role and the metric it feeds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "exporter" "values" .Values.exporter) }}
  labels:
    {{- include "mxlk8s.componentLabels" (dict "Context" . "component" "exporter") | nindent 4 }}
rules:
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflows]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "exporter" "values" .Values.exporter) }}
  labels:
    {{- include "mxlk8s.componentLabels" (dict "Context" . "component" "exporter") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "exporter" "values" .Values.exporter) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mxlk8s.serviceAccountName" (dict "Context" . "component" "exporter" "values" .Values.exporter) }}
    namespace: {{ include "mxlk8s.namespace" . }}
{{- end }}
