  names:
    kind: MxlFlowRedundancySet
    listKind: MxlFlowRedundancySetList
    plural: mxlflowredundancysets
    shortNames:
    - mxlrs
    singular: mxlflowredundancyset
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.output.flowID
      name: Output
      type: string
