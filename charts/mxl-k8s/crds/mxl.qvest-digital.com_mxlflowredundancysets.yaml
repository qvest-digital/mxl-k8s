      name: Members
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MxlFlowRedundancySet serves one flow from several member flows,
          switching members per grain, or per page of audio, wherever one fails
          to deliver.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MxlFlowRedundancySetSpec declares a flow served from several member
              flows: on every node a reader opens the output, each grain, or each
              page of an audio channel buffer, comes from a member that holds it,
              without copying payload.

              Members must be the same flow in content and timing: the same format,
              geometry and rate, with indices anchored to the same epoch, as two
              copies of one source over separate paths or two producers locked to
              one reference are.
            properties:
              granularity:
                default: Grain
                description: Granularity is the unit members are switched in. Defaults
                  to Grain.
                enum:
                - Grain
                - Slice
                type: string
              members:
                description: |-
                  Members are the flows the output is served from, in order of
                  preference. At most seven: a merged flow selects among its members
                  and one placeholder for what no member delivered.
                items:
                  description: RedundancyFlowRef names one flow by domain and id.
                  properties:
                    domain:
                      description: |-
                        Domain is the MxlDomain the flow belongs to; empty is the primary
                        domain.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    flowID:
                      description: FlowID is the flow's id.
                      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                      type: string
                  required:
                  - flowID
                  type: object
                maxItems: 7
                minItems: 2
                type: array
                x-kubernetes-list-type: atomic
              output:
                description: Output is the flow readers open. Its id must name no
                  other flow.
                properties:
                  domain:
                    description: |-
                      Domain is the MxlDomain the flow belongs to; empty is the primary
                      domain.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  flowID:
                    description: FlowID is the flow's id.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - flowID
                type: object
              preference:
                default: Ordered
                description: |-
                  Preference picks among members that all deliver. Defaults to
                  Ordered.
                enum:
                - Ordered
                - FirstArrival
                type: string
              skewBudget:
                default: 40ms
                description: |-
                  SkewBudget is how long a grain or sample range may be late from
                  every member before it is published as missing. It bounds the
                  latency a member outage adds; members further apart than this lose
                  grains. Defaults to 40ms.
                type: string
            required:
            - members
            - output
            type: object
          status:
            description: MxlFlowRedundancySetStatus reports where the output is served.
            properties:
              conditions:
                description: 'Conditions: Valid reports whether the members can be
                  merged.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodes:
                description: |-
                  Nodes are the nodes a reader asked for the output on. The gateway
                  on each serves it, from member mirrors the operator creates there.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
