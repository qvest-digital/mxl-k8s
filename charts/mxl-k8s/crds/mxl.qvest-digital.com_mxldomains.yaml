---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: mxldomains.mxl.qvest-digital.com
spec:
  group: mxl.qvest-digital.com
  names:
    kind: MxlDomain
    listKind: MxlDomainList
    plural: mxldomains
    shortNames:
    - mxldom
    singular: mxldomain
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.id
      name: ID
      type: string
    - jsonPath: .spec.directory
      name: Directory
      type: string
    - jsonPath: .spec.label
      name: Label
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MxlDomain is one MXL domain: one identity, materialised as a
          directory carrying domain_def.json on every selected node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MxlDomainSpec defines one MXL domain.

              A domain is one store of flows with one identity. The agent
              materialises it as a directory on every node it selects, and mxl-k8s
              mirrors flows between those directories on demand, so a function on
              any selected node opens any flow of the domain by id. That is why the
              identity is the domain's and not the node's: it is the same on every
              node and known before any pod is placed.
            properties:
              description:
                description: Description is the domain_def.json description.
                type: string
              directory:
                description: |-
                  Directory is the domain directory's name below the agent's
                  runtime root, one path segment.
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$
                type: string
                x-kubernetes-validations:
                - message: directory is immutable; flows already written live under
                    the old one
                  rule: self == oldSelf
              historyDuration:
                description: |-
                  HistoryDuration is the ring buffer depth libmxl gives every flow
                  created in the domain, written to options.json. Unset leaves
                  options.json alone, whoever wrote it. libmxl reads it when a flow
                  is created, so a change reaches only flows created after it.

                  Checked by the API server: a value the schema admitted but the
                  typed client cannot decode fails every List of MxlDomains, which
                  stops every agent and the operator at once.
                type: string
                x-kubernetes-validations:
                - message: historyDuration must be a positive duration such as 2s
                    or 500ms
                  rule: self.matches('^([0-9]+([.][0-9]+)?(ns|us|ms|s|m|h))+$') &&
                    duration(self) > duration('0s')
              id:
                description: |-
                  ID is the domain identity written into domain_def.json and
                  published as mxl_domain_id by NMOS nodes. Immutable: every
                  reference a controller holds is to this value.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-9a-f][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                type: string
                x-kubernetes-validations:
                - message: id is immutable
                  rule: self == oldSelf
              label:
                description: Label is the domain_def.json label.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector limits the nodes the domain is materialised on.
                  Empty selects every node an agent runs on.
                type: object
              tags:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: Tags are the domain_def.json tags.
                type: object
            required:
            - directory
            - id
            type: object
          status:
            description: MxlDomainStatus reports where a domain is materialised.
            properties:
              conditions:
                description: Conditions describes the current state of the domain.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodes:
                description: |-
                  Nodes has one entry per node the domain is selected on, each
                  written by that node's agent.
                items:
                  description: MxlDomainNodeStatus is one node's account of a domain.
                  properties:
                    capacityBytes:
                      description: |-
                        CapacityBytes is the size of the filesystem backing the
                        directory.
                      format: int64
                      type: integer
                    fanotifyReady:
                      description: |-
                        FanotifyReady reports whether the agent watches the directory
                        for flow creation. Only meaningful where Mirrored is true.
                      type: boolean
                    freeBytes:
                      description: FreeBytes is the unused size of that filesystem.
                      format: int64
                      type: integer
                    lastSeen:
                      description: LastSeen is when the node's agent last reported.
                      format: date-time
                      type: string
                    message:
                      description: Message says why Ready is false.
                      type: string
                    mirrored:
                      description: |-
                        Mirrored is true when the node's agent tracks this domain's
                        flows, which is what lets mxl-k8s mirror them to other nodes. A
                        domain that is materialised but not mirrored is readable only on
                        the node a flow was written on.
                      type: boolean
                    nodeName:
                      description: NodeName is the node the entry describes.
                      type: string
                    ready:
                      description: |-
                        Ready is true when the directory and domain_def.json on the node
                        match the spec.
                      type: boolean
                  required:
                  - mirrored
                  - nodeName
                  - ready
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - nodeName
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
